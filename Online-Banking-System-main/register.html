<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Online Banking</title>
    <link rel="stylesheet" href="style.css">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="auth-body">

    <!-- Decorative background blobs -->
    <div class="bg-shape shape1"></div>
    <div class="bg-shape shape2"></div>
    <div class="bg-shape shape3"></div>

    <div class="auth-container">
        <div class="auth-card">
            <h1><i class="lucide" data-lucide="wallet" style="vertical-align: middle; margin-right: 8px;"></i>Online Banking</h1>
            <h2>Create Account</h2>
            
            <form onsubmit="registerUser(event)">
                <div class="form-group" style="position: relative;">
                    <input type="text" id="fullname" placeholder="Full Name" required style="padding-left: 45px;">
                    <i data-lucide="user" style="position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: var(--text-secondary); width: 18px; height: 18px;"></i>
                </div>

                <div class="form-group" style="position: relative;">
                    <input type="email" id="email" placeholder="Email Address" required style="padding-left: 45px;">
                    <i data-lucide="mail" style="position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: var(--text-secondary); width: 18px; height: 18px;"></i>
                </div>
                
                <div class="form-group" style="position: relative;">
                    <input type="password" id="password" placeholder="Choose Password" required style="padding-left: 45px;">
                    <i data-lucide="lock" style="position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: var(--text-secondary); width: 18px; height: 18px;"></i>
                </div>
                
                <button type="submit" class="btn-submit">
                    Register <i data-lucide="user-plus" style="width: 18px; height: 18px;"></i>
                </button>
            </form>
            
            <p>
                Already have an account? 
                <a href="login.html">Login here</a>
            </p>
        </div>
    </div>

    <!-- Toast notifier -->
    <div id="toast"></div>

    <script src="script.js"></script>
    <script>
        // Init Lucide Icons
        if (window.lucide) {
            window.lucide.createIcons();
        }
    </script>
</body>
</html>
